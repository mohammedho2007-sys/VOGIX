<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOGIX - Premium Hoodies & Streetwear</title>
    <style>
        /* ============================================
           VOGIX - Premium Link Hub Styles
           ============================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #0a0a0f;
            --secondary-dark: #12121a;
            --card-bg: rgba(20, 20, 30, 0.6);
            --electric-blue: #00f0ff;
            --violet: #a855f7;
            --chrome: #e0e0e0;
            --glass-border: rgba(255, 255, 255, 0.1);
            --glow-blue: rgba(0, 240, 255, 0.3);
            --glow-violet: rgba(168, 85, 247, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--primary-dark);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ============================================
           Animated Background
           ============================================ */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0a0a0f 100%);
        }

        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: float 20s ease-in-out infinite;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.15) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.12) 0%, transparent 70%);
            bottom: -150px;
            left: -150px;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.08) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(30px, -30px) scale(1.05);
            }
            50% {
                transform: translate(-20px, 20px) scale(0.95);
            }
            75% {
                transform: translate(20px, 10px) scale(1.02);
            }
        }

        /* Particle System */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--electric-blue);
            border-radius: 50%;
            opacity: 0;
            animation: particle-float 8s ease-in-out infinite;
        }

        @keyframes particle-float {
            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0);
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1);
            }
        }

        /* Animated Grid Lines */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
            animation: grid-pulse 4s ease-in-out infinite;
        }

        @keyframes grid-pulse {
            0%, 100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        /* ============================================
           Main Card Container
           ============================================ */
        .card-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            perspective: 1000px;
            z-index: 10;
        }

        .glass-card {
            position: relative;
            background: linear-gradient(
                135deg,
                rgba(30, 30, 45, 0.7) 0%,
                rgba(20, 20, 30, 0.8) 100%
            );
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 80px rgba(0, 240, 255, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 24px;
            padding: 2px;
            background: linear-gradient(
                135deg,
                rgba(0, 240, 255, 0.3),
                transparent 50%,
                rgba(168, 85, 247, 0.3)
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Neon Glow Behind Card */
        .card-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background: radial-gradient(
                ellipse at center,
                rgba(0, 240, 255, 0.15) 0%,
                transparent 60%
            );
            filter: blur(40px);
            z-index: -1;
            animation: glow-pulse 4s ease-in-out infinite;
        }

        @keyframes glow-pulse {
            0%, 100% {
                opacity: 0.6;
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.1);
            }
        }

        /* ============================================
           Header / Hero Section
           ============================================ */
        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-container {
            position: relative;
            display: inline-block;
            margin-bottom: 25px;
        }

        .logo-frame {
            width: 130px;
            height: 130px;
            position: relative;
            margin: 0 auto;
        }

        .logo-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            background: radial-gradient(
                circle,
                rgba(0, 240, 255, 0.4) 0%,
                rgba(168, 85, 247, 0.2) 50%,
                transparent 70%
            );
            border-radius: 50%;
            filter: blur(15px);
            animation: logo-glow-pulse 3s ease-in-out infinite;
        }

        @keyframes logo-glow-pulse {
            0%, 100% {
                opacity: 0.8;
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.15);
            }
        }

        .logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 1;
            border: 3px solid transparent;
            background: linear-gradient(var(--primary-dark), var(--primary-dark)) padding-box,
                        linear-gradient(135deg, var(--electric-blue), var(--violet)) border-box;
            box-shadow:
                0 0 40px rgba(0, 240, 255, 0.3),
                0 10px 30px rgba(0, 0, 0, 0.5);
            animation: logo-float 6s ease-in-out infinite;
        }

        @keyframes logo-float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .brand-name {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            background: linear-gradient(
                135deg,
                #fff 0%,
                var(--chrome) 25%,
                var(--electric-blue) 50%,
                #fff 75%,
                var(--chrome) 100%
            );
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: chrome-shift 4s ease-in-out infinite;
            text-shadow: none;
            filter: drop-shadow(0 0 30px rgba(0, 240, 255, 0.5));
            margin-bottom: 8px;
        }

        @keyframes chrome-shift {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .tagline {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 6px;
            font-weight: 300;
        }

        .sub-tagline {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            font-style: italic;
            letter-spacing: 1px;
        }

        /* ============================================
           Social Links Section
           ============================================ */
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .social-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 24px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(
                135deg,
                rgba(30, 30, 45, 0.8) 0%,
                rgba(20, 20, 30, 0.9) 100%
            );
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .social-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            transition: left 0.5s ease;
        }

        .social-btn:hover::before {
            left: 100%;
        }

        .social-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            padding: 2px;
            background: linear-gradient(
                135deg,
                var(--accent-color),
                transparent 60%
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .social-btn:hover::after {
            opacity: 1;
        }

        .social-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.4),
                0 0 30px var(--accent-glow);
        }

        .social-btn:active {
            transform: translateY(0) scale(0.98);
            transition: transform 0.1s ease;
        }

        .social-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            filter: drop-shadow(0 0 10px var(--accent-glow));
        }

        /* Individual Button Styles */
        .btn-facebook {
            --accent-color: #1877f2;
            --accent-glow: rgba(24, 119, 242, 0.4);
        }

        .btn-facebook:hover {
            background: linear-gradient(135deg, rgba(24, 119, 242, 0.2) 0%, rgba(20, 20, 30, 0.9) 100%);
            border-color: rgba(24, 119, 242, 0.3);
        }

        .btn-instagram {
            --accent-color: #e4405f;
            --accent-glow: rgba(228, 64, 95, 0.4);
        }

        .btn-instagram:hover {
            background: linear-gradient(135deg, rgba(228, 64, 95, 0.2) 0%, rgba(20, 20, 30, 0.9) 100%);
            border-color: rgba(228, 64, 95, 0.3);
        }

        .btn-tiktok {
            --accent-color: #00f2ea;
            --accent-glow: rgba(0, 242, 234, 0.4);
        }

        .btn-tiktok:hover {
            background: linear-gradient(135deg, rgba(0, 242, 234, 0.15) 0%, rgba(20, 20, 30, 0.9) 100%);
            border-color: rgba(0, 242, 234, 0.3);
        }

        .btn-whatsapp {
            --accent-color: #25d366;
            --accent-glow: rgba(37, 211, 102, 0.4);
        }

        .btn-whatsapp:hover {
            background: linear-gradient(135deg, rgba(37, 211, 102, 0.2) 0%, rgba(20, 20, 30, 0.9) 100%);
            border-color: rgba(37, 211, 102, 0.3);
        }

        .btn-store {
            --accent-color: var(--electric-blue);
            --accent-glow: rgba(0, 240, 255, 0.4);
        }

        .btn-store:hover {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15) 0%, rgba(20, 20, 30, 0.9) 100%);
            border-color: rgba(0, 240, 255, 0.3);
        }

        /* Icon SVGs */
        .icon-svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* ============================================
           Footer
           ============================================ */
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .footer p {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
        }

        /* ============================================
           Animations
           ============================================ */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
        .delay-5 { animation-delay: 0.5s; }
        .delay-6 { animation-delay: 0.6s; }
        .delay-7 { animation-delay: 0.7s; }

        /* ============================================
           Responsive Design
           ============================================ */
        @media (max-width: 520px) {
            .glass-card {
                padding: 30px 20px;
            }

            .brand-name {
                font-size: 2.2rem;
                letter-spacing: 5px;
            }

            .logo {
                width: 110px;
                height: 110px;
            }

            .logo-frame {
                width: 110px;
                height: 110px;
            }

            .logo-glow {
                width: 130px;
                height: 130px;
            }

            .social-btn {
                padding: 16px 20px;
                font-size: 0.9rem;
            }

            .social-icon {
                width: 24px;
                height: 24px;
                font-size: 1.2rem;
            }
        }

        @media (max-width: 380px) {
            .brand-name {
                font-size: 1.8rem;
                letter-spacing: 4px;
            }

            .tagline {
                font-size: 0.85rem;
            }

            .social-links {
                gap: 12px;
            }

            .social-btn {
                padding: 14px 16px;
            }
        }

        /* ============================================
           Scrollbar Styling
           ============================================ */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--primary-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--electric-blue), var(--violet));
            border-radius: 4px;
        }
    </style>
</head>

    <script>
        // ============================================
        // VOGIX - Premium Link Hub Scripts
        // ============================================

        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 30;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';

                // Random positioning
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.animationDuration = (6 + Math.random() * 4) + 's';

                // Random size
                const size = 1 + Math.random() * 3;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';

                // Random color (blue or violet)
                const colors = ['#00f0ff', '#a855f7', '#fff'];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.boxShadow = `0 0 ${size * 2}px ${particle.style.background}`;

                container.appendChild(particle);
            }
        }

        // 3D Tilt Effect on Mouse Movement
        function initTiltEffect() {
            const card = document.getElementById('glassCard');
            const container = document.getElementById('cardContainer');

            container.addEventListener('mousemove', (e) => {
                const rect = container.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const centerX = rect.width / 2;
                const centerY = rect.height / 2;

                const rotateX = (y - centerY) / 30;
                const rotateY = (centerX - x) / 30;

                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });

            container.addEventListener('mouseleave', () => {
                card.style.transform = 'rotateX(0deg) rotateY(0deg)';
            });
        }

        // Initialize effects on load
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            initTiltEffect();
        });

        // Smooth scroll behavior
        document.documentElement.style.scrollBehavior = 'smooth';
    </script>
