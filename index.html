
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<meta name="theme-color" content="#0a0a0c" />
<meta name="description" content="VOGIX — Premium Hoodies. Streetwear Energy. Official social links and store." />
<title>VOGIX — Official Links</title>

<!-- ========== EXTERNAL CDNs (Fonts + Icons only) ========== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
  /* =====================================================
     VOGIX — Luxury Streetwear Social Hub
     Single-file premium design
     ===================================================== */

  /* ---------- Design Tokens / CSS Variables ---------- */
  :root{
    /* Colors */
    --bg-0: #050507;
    --bg-1: #0a0a0d;
    --bg-2: #101014;
    --ink-0: #ffffff;
    --ink-1: #e8e8ee;
    --ink-2: #a9a9b3;
    --ink-3: #6b6b76;
    --line: rgba(255,255,255,0.08);
    --line-2: rgba(255,255,255,0.14);
    --glass: rgba(255,255,255,0.04);
    --glass-2: rgba(255,255,255,0.06);

    /* Accents */
    --accent-1: #c9c4ff;   /* soft lavender silver */
    --accent-2: #7a8cff;   /* electric blue */
    --accent-3: #ff5cf0;   /* neon magenta (very subtle) */
    --accent-4: #6effd6;   /* mint glow */
    --silver: #d8d8e0;

    /* Shadows */
    --shadow-soft: 0 10px 40px rgba(0,0,0,0.4);
    --shadow-strong: 0 30px 80px rgba(0,0,0,0.55);
    --glow-1: 0 0 60px rgba(122,140,255,0.25);
    --glow-2: 0 0 80px rgba(255,92,240,0.18);

    /* Spacing */
    --sp-1: 6px;
    --sp-2: 10px;
    --sp-3: 14px;
    --sp-4: 18px;
    --sp-5: 24px;
    --sp-6: 32px;
    --sp-7: 48px;

    /* Radii */
    --r-sm: 10px;
    --r-md: 16px;
    --r-lg: 22px;
    --r-xl: 28px;

    /* Transitions */
    --ease: cubic-bezier(.22,.61,.36,1);
    --ease-2: cubic-bezier(.2,.8,.2,1);
    --t-fast: 220ms var(--ease);
    --t-mid: 480ms var(--ease);
    --t-slow: 900ms var(--ease);
  }

  /* ---------- Reset ---------- */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body{
    font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg-0);
    color: var(--ink-1);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    min-height: 100svh;
    line-height: 1.5;
    text-rendering: optimizeLegibility;
  }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }
  button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; }

  /* Selection */
  ::selection { background: rgba(122,140,255,0.35); color: #fff; }

  /* Focus styles for accessibility */
  :focus-visible{
    outline: 2px solid var(--accent-2);
    outline-offset: 3px;
    border-radius: 12px;
  }

  /* ---------- Background Layers ---------- */
  .bg-stage{
    position: fixed; inset: 0; z-index: -3;
    background:
      radial-gradient(1200px 800px at 80% -10%, rgba(122,140,255,0.18), transparent 60%),
      radial-gradient(900px 700px at -10% 110%, rgba(255,92,240,0.12), transparent 60%),
      radial-gradient(700px 600px at 50% 50%, rgba(110,255,214,0.06), transparent 70%),
      linear-gradient(180deg, #06060a 0%, #0a0a0f 50%, #050507 100%);
  }

  /* Aurora animated gradient */
  .aurora{
    position: fixed; inset: -20%; z-index: -2; pointer-events: none;
    filter: blur(80px) saturate(120%);
    opacity: 0.55;
    background:
      conic-gradient(from 200deg at 50% 50%,
        rgba(122,140,255,0.35) 0deg,
        rgba(255,92,240,0.25) 90deg,
        rgba(110,255,214,0.18) 180deg,
        rgba(122,140,255,0.30) 270deg,
        rgba(122,140,255,0.35) 360deg);
    animation: auroraSpin 28s linear infinite;
    will-change: transform;
  }
  @keyframes auroraSpin {
    to { transform: rotate(360deg); }
  }

  /* Subtle noise texture (CSS only) */
  .noise{
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    opacity: 0.06;
    mix-blend-mode: overlay;
    background-image:
      radial-gradient(rgba(255,255,255,0.5) 1px, transparent 1px),
      radial-gradient(rgba(255,255,255,0.35) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 2px;
  }

  /* Floating shapes (parallax) */
  .shape{
    position: fixed; z-index: -2; pointer-events: none;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.55;
    will-change: transform;
    transition: transform 1.2s var(--ease-2);
  }
  .shape.s1{ width: 380px; height: 380px; top: -80px; left: -80px; background: radial-gradient(circle, rgba(122,140,255,0.55), transparent 60%); }
  .shape.s2{ width: 460px; height: 460px; bottom: -120px; right: -120px; background: radial-gradient(circle, rgba(255,92,240,0.45), transparent 60%); }
  .shape.s3{ width: 300px; height: 300px; top: 40%; left: 60%; background: radial-gradient(circle, rgba(110,255,214,0.35), transparent 60%); }

  /* Cursor glow (desktop only) */
  .cursor-glow{
    position: fixed; top: 0; left: 0; width: 520px; height: 520px;
    border-radius: 50%; pointer-events: none; z-index: 0;
    background: radial-gradient(closest-side, rgba(122,140,255,0.18), rgba(122,140,255,0.06) 40%, transparent 70%);
    transform: translate(-50%, -50%);
    transition: opacity 400ms var(--ease);
    opacity: 0;
    mix-blend-mode: screen;
  }

  /* Particle canvas */
  #particles{
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
  }

  /* ---------- Loader ---------- */
  .loader{
    position: fixed; inset: 0; z-index: 9999;
    display: grid; place-items: center;
    background: radial-gradient(ellipse at center, #0b0b10 0%, #050507 70%);
    transition: opacity 700ms var(--ease), visibility 700ms var(--ease);
  }
  .loader.hidden{ opacity: 0; visibility: hidden; }
  .loader-inner{
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 26px;
  }
  .loader-ring{
    position: relative;
    width: 110px; height: 110px;
    display: grid; place-items: center;
  }
  .loader-ring::before, .loader-ring::after{
    content: ""; position: absolute; inset: 0;
    border-radius: 50%;
    border: 1px solid transparent;
  }
  .loader-ring::before{
    border-top-color: rgba(122,140,255,0.9);
    border-right-color: rgba(255,92,240,0.7);
    animation: spin 1.6s linear infinite;
    box-shadow: 0 0 30px rgba(122,140,255,0.35);
  }
  .loader-ring::after{
    inset: 12px;
    border-bottom-color: rgba(110,255,214,0.7);
    border-left-color: rgba(216,216,224,0.6);
    animation: spin 2.4s linear infinite reverse;
  }
  .loader-mark{
    font-family: 'Syncopate', 'Space Grotesk', sans-serif;
    font-weight: 700;
    letter-spacing: 0.4em;
    font-size: 14px;
    color: var(--ink-1);
    text-shadow: 0 0 18px rgba(122,140,255,0.5);
  }
  .loader-sub{
    font-size: 11px; letter-spacing: 0.4em; color: var(--ink-3); text-transform: uppercase;
  }
  .loader-bar{
    width: 180px; height: 1px; background: rgba(255,255,255,0.08); position: relative; overflow: hidden;
  }
  .loader-bar::after{
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, var(--accent-1), transparent);
    animation: barSlide 1.4s var(--ease) infinite;
  }
  @keyframes barSlide {
    0%{ transform: translateX(-100%); }
    100%{ transform: translateX(100%); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Page Wrapper ---------- */
  .page{
    position: relative; z-index: 1;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: clamp(20px, 4vw, 48px);
    opacity: 0;
    transition: opacity 800ms var(--ease) 200ms;
  }
  .page.visible{ opacity: 1; }

  /* ---------- Card ---------- */
  .card-wrap{
    position: relative;
    width: 100%;
    max-width: 480px;
    isolation: isolate;
  }

  /* Animated gradient border using mask trick */
  .card-wrap::before{
    content: "";
    position: absolute; inset: -1px;
    border-radius: calc(var(--r-xl) + 1px);
    padding: 1px;
    background: conic-gradient(
      from var(--angle, 0deg),
      rgba(122,140,255,0.9),
      rgba(255,92,240,0.7),
      rgba(110,255,214,0.6),
      rgba(216,216,224,0.7),
      rgba(122,140,255,0.9)
    );
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    opacity: 0.7;
    animation: borderSpin 8s linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }
  @keyframes borderSpin {
    to { --angle: 360deg; }
  }

  .card{
    position: relative;
    border-radius: var(--r-xl);
    padding: clamp(24px, 4.5vw, 40px) clamp(20px, 4vw, 36px);
    background:
      linear-gradient(180deg, rgba(20,20,28,0.7), rgba(10,10,14,0.65));
    border: 1px solid var(--line-2);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    box-shadow:
      var(--shadow-strong),
      inset 0 1px 0 rgba(255,255,255,0.06),
      var(--glow-1);
    overflow: hidden;
  }
  /* Fallback if backdrop-filter unsupported */
  @supports not ((backdrop-filter: blur(10px)) or (-webkit-backdrop-filter: blur(10px))) {
    .card { background: linear-gradient(180deg, rgba(18,18,24,0.92), rgba(10,10,14,0.92)); }
  }

  /* Card shine sweep */
  .card::after{
    content: "";
    position: absolute;
    top: -50%; left: -60%;
    width: 70%; height: 200%;
    background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.06) 45%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.06) 55%, transparent 70%);
    transform: rotate(12deg);
    pointer-events: none;
    animation: shineSweep 9s var(--ease) infinite;
    opacity: 0.6;
  }
  @keyframes shineSweep{
    0%   { transform: translateX(-30%) rotate(12deg); }
    60%  { transform: translateX(280%) rotate(12deg); }
    100% { transform: translateX(280%) rotate(12deg); }
  }

  /* ---------- Header / Brand ---------- */
  .official{
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-2);
    margin: 0 auto;
  }
  .official .dot{
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-4);
    box-shadow: 0 0 10px var(--accent-4), 0 0 18px rgba(110,255,214,0.6);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity: 1; transform: scale(1); }
    50%{ opacity: 0.5; transform: scale(0.85); }
  }

  .header{
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    text-align: center;
    margin-bottom: clamp(24px, 4vw, 32px);
  }

  .logo-frame{
    position: relative;
    width: clamp(96px, 22vw, 116px);
    height: clamp(96px, 22vw, 116px);
    border-radius: 26px;
    padding: 2px;
    background: linear-gradient(140deg, rgba(255,255,255,0.16), rgba(255,255,255,0.02) 50%, rgba(122,140,255,0.25));
    box-shadow: 0 20px 50px rgba(0,0,0,0.55), 0 0 40px rgba(122,140,255,0.18);
    margin-top: 6px;
    transform: translateY(20px) scale(0.9);
    opacity: 0;
    transition: transform 1s var(--ease) 200ms, opacity 1s var(--ease) 200ms;
  }
  .visible .logo-frame{ opacity: 1; transform: translateY(0) scale(1); }

  .logo-inner{
    width: 100%; height: 100%;
    border-radius: 24px;
    background: linear-gradient(180deg, #0e0e14, #060608);
    display: grid; place-items: center;
    overflow: hidden;
    position: relative;
  }
  .logo-inner img{
    width: 100%; height: 100%;
    object-fit: cover;
    filter: contrast(1.05) saturate(1.05);
  }
  .logo-inner::after{
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.08), transparent 30%, transparent 70%, rgba(0,0,0,0.4));
    pointer-events: none;
  }

  .brand{
    font-family: 'Syncopate', 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(34px, 7vw, 46px);
    letter-spacing: 0.18em;
    color: var(--ink-0);
    line-height: 1;
    background: linear-gradient(180deg, #ffffff 0%, #c9c4ff 60%, #8b8b95 120%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 40px rgba(122,140,255,0.15);
    display: inline-flex; align-items: center; gap: 10px;
  }

  .verified{
    display: inline-grid; place-items: center;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7a8cff, #c9c4ff);
    color: #0a0a10;
    font-size: 11px;
    box-shadow: 0 0 18px rgba(122,140,255,0.5);
    flex-shrink: 0;
  }

  .tagline{
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    font-weight: 400;
    font-size: clamp(13px, 2.6vw, 14px);
    color: var(--ink-2);
    letter-spacing: 0.06em;
  }
  .tagline .sep{
    display: inline-block; width: 4px; height: 4px; border-radius: 50%;
    background: var(--ink-3); margin: 0 10px; vertical-align: middle;
  }

  /* ---------- Links ---------- */
  .links{
    display: flex; flex-direction: column; gap: 12px;
    margin-top: 4px;
  }

  .link{
    --i: 0;
    position: relative;
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px;
    border-radius: var(--r-md);
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015));
    border: 1px solid var(--line);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    overflow: hidden;
    transition:
      transform 500ms var(--ease),
      border-color 400ms var(--ease),
      background 400ms var(--ease),
      box-shadow 400ms var(--ease);
    opacity: 0;
    transform: translateY(18px);
    will-change: transform;
  }
  .visible .link{
    animation: linkIn 700ms var(--ease) forwards;
    animation-delay: calc(420ms + var(--i) * 90ms);
  }
  @keyframes linkIn{
    to { opacity: 1; transform: translateY(0); }
  }

  /* Hover light that follows pointer */
  .link::before{
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(220px 160px at var(--mx, 50%) var(--my, 50%),
      rgba(255,255,255,0.10), transparent 60%);
    opacity: 0;
    transition: opacity 300ms var(--ease);
    pointer-events: none;
  }
  .link::after{
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    box-shadow: inset 0 0 0 1px transparent;
    transition: box-shadow 400ms var(--ease);
    pointer-events: none;
  }
  .link:hover, .link:focus-visible{
    transform: translateY(-2px);
    border-color: var(--line-2);
    background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
    box-shadow: 0 18px 40px rgba(0,0,0,0.45), 0 0 30px rgba(122,140,255,0.14);
  }
  .link:hover::before, .link:focus-visible::before{ opacity: 1; }
  .link:hover::after{ box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18); }

  .link .icon{
    flex-shrink: 0;
    width: 46px; height: 46px;
    display: grid; place-items: center;
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border: 1px solid var(--line);
    color: var(--ink-1);
    font-size: 18px;
    transition: transform 500ms var(--ease), color 300ms var(--ease), box-shadow 400ms var(--ease);
  }
  .link:hover .icon{
    transform: scale(1.06) rotate(-3deg);
  }

  .link .text{
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; gap: 2px;
  }
  .link .label{
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--ink-0);
  }
  .link .desc{
    font-size: 12.5px;
    color: var(--ink-2);
    letter-spacing: 0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .link .arrow{
    flex-shrink: 0;
    width: 28px; height: 28px;
    display: grid; place-items: center;
    border-radius: 50%;
    color: var(--ink-2);
    font-size: 12px;
    transition: transform 400ms var(--ease), color 300ms var(--ease), background 300ms var(--ease);
  }
  .link:hover .arrow{
    transform: translateX(3px);
    color: var(--ink-0);
    background: rgba(255,255,255,0.06);
  }

  /* Per-platform accent on icon */
  .link.facebook:hover .icon  { color: #6f8bff; box-shadow: 0 0 22px rgba(111,139,255,0.35); }
  .link.instagram:hover .icon { color: #ff7ad6; box-shadow: 0 0 22px rgba(255,92,180,0.35); }
  .link.tiktok:hover .icon    { color: #ffffff; box-shadow: 0 0 22px rgba(255,255,255,0.18); }
  .link.whatsapp:hover .icon  { color: #5fe39a; box-shadow: 0 0 22px rgba(95,227,154,0.35); }
  .link.store:hover .icon     { color: #c9c4ff; box-shadow: 0 0 22px rgba(201,196,255,0.35); }

  /* ---------- Footer ---------- */
  .foot{
    margin-top: clamp(22px, 4vw, 30px);
    text-align: center;
    font-size: 11.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .foot .divider{
    width: 40px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    margin: 0 auto 14px;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 480px){
    .link{ padding: 12px 14px; gap: 12px; }
    .link .icon{ width: 42px; height: 42px; font-size: 16px; }
    .link .label{ font-size: 14px; }
    .link .desc{ font-size: 12px; }
    .official{ font-size: 10px; padding: 5px 10px; letter-spacing: 0.24em; }
  }
  @media (max-width: 360px){
    .brand{ letter-spacing: 0.14em; }
  }

  /* Hide cursor glow on touch */
  @media (hover: none) {
    .cursor-glow{ display: none; }
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
    .aurora, .card::after, .card-wrap::before { animation: none !important; }
    .shape{ display: none; }
    .page{ opacity: 1; transition: none; }
  }
</style>
</head>
<body>

  <!-- ========== Background Layers ========== -->
  <div class="bg-stage" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>
  <div class="shape s1" aria-hidden="true"></div>
  <div class="shape s2" aria-hidden="true"></div>
  <div class="shape s3" aria-hidden="true"></div>
  <canvas id="particles" aria-hidden="true"></canvas>
  <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

  <!-- ========== Loader ========== -->
  <div class="loader" id="loader" role="status" aria-live="polite" aria-label="Loading VOGIX">
    <div class="loader-inner">
      <div class="loader-ring"></div>
      <div class="loader-mark">VOGIX</div>
      <div class="loader-bar" aria-hidden="true"></div>
      <div class="loader-sub">Loading Experience</div>
    </div>
  </div>

  <!-- ========== Main Page ========== -->
  <main class="page" id="page">
    <div class="card-wrap">
      <article class="card" aria-labelledby="brandName">

        <!-- Header / Brand block -->
        <header class="header">
          <span class="official" aria-label="Official VOGIX Links">
            <span class="dot" aria-hidden="true"></span>
            Official VOGIX Links
          </span>

          <!-- Logo -->
          <div class="logo-frame" aria-hidden="false">
            <div class="logo-inner">
              <!-- Brand logo -->
              <img src="https://www.image2url.com/r2/default/images/1777713783463-dc7788b7-7690-4951-91e4-86842ae52e3d.jpg" alt="VOGIX logo" loading="eager" />
            </div>
          </div>

          <h1 class="brand" id="brandName">
            VOGIX
            <span class="verified" title="Verified official brand" aria-label="Verified official">
              <i class="fa-solid fa-check" aria-hidden="true"></i>
            </span>
          </h1>

          <p class="tagline">
            Premium Hoodies <span class="sep" aria-hidden="true"></span> Streetwear Energy
          </p>
        </header>

        <!-- =======================================================
             SOCIAL LINKS — Edit href values below to update links

<script>
  /* =====================================================
     VOGIX — Interactions
     ===================================================== */
  (function(){
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ---------- Loader ---------- */
    const loader = document.getElementById('loader');
    const page = document.getElementById('page');
    const minLoad = reduced ? 200 : 1400;
    const start = performance.now();

    function revealPage(){
      const elapsed = performance.now() - start;
      const wait = Math.max(0, minLoad - elapsed);
      setTimeout(() => {
        loader.classList.add('hidden');
        page.classList.add('visible');
        setTimeout(() => loader.remove(), 800);
      }, wait);
    }

    if (document.readyState === 'complete') revealPage();
    else window.addEventListener('load', revealPage);

    /* ---------- Cursor Glow ---------- */
    const glow = document.getElementById('cursorGlow');
    let mx = window.innerWidth/2, my = window.innerHeight/2;
    let gx = mx, gy = my;
    let glowVisible = false;

    if (window.matchMedia('(hover: hover)').matches && !reduced){
      window.addEventListener('mousemove', (e) => {
        mx = e.clientX; my = e.clientY;
        if (!glowVisible){ glow.style.opacity = '1'; glowVisible = true; }
      }, { passive: true });
      window.addEventListener('mouseleave', () => {
        glow.style.opacity = '0'; glowVisible = false;
      });

      const animateGlow = () => {
        gx += (mx - gx) * 0.12;
        gy += (my - gy) * 0.12;
        glow.style.transform = `translate(${gx}px, ${gy}px) translate(-50%, -50%)`;
        requestAnimationFrame(animateGlow);
      };
      requestAnimationFrame(animateGlow);
    }

    /* ---------- Parallax shapes ---------- */
    const shapes = document.querySelectorAll('.shape');
    if (!reduced){
      window.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth - 0.5);
        const y = (e.clientY / window.innerHeight - 0.5);
        shapes.forEach((s, i) => {
          const depth = (i + 1) * 14;
          s.style.transform = `translate(${x * depth}px, ${y * depth}px)`;
        });
      }, { passive: true });
    }

    /* ---------- Link pointer-light + magnetic feel ---------- */
    const links = document.querySelectorAll('.link');
    links.forEach(link => {
      link.addEventListener('mousemove', (e) => {
        const r = link.getBoundingClientRect();
        const x = ((e.clientX - r.left) / r.width) * 100;
        const y = ((e.clientY - r.top) / r.height) * 100;
        link.style.setProperty('--mx', x + '%');
        link.style.setProperty('--my', y + '%');
        if (!reduced){
          const px = (e.clientX - r.left - r.width/2) / r.width;
          const py = (e.clientY - r.top - r.height/2) / r.height;
          link.style.transform = `translateY(-2px) translate(${px*4}px, ${py*2}px)`;
        }
      });
      link.addEventListener('mouseleave', () => {
        link.style.transform = '';
      });
    });

    /* ---------- Particles ---------- */
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let W, H, particles = [];
    const DPR = Math.min(window.devicePixelRatio || 1, 2);

    function resize(){
      W = canvas.width = window.innerWidth * DPR;
      H = canvas.height = window.innerHeight * DPR;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
    }
    resize();
    window.addEventListener('resize', resize);

    function initParticles(){
      const count = reduced ? 0 : Math.min(60, Math.floor((window.innerWidth * window.innerHeight) / 28000));
      particles = [];
      for (let i = 0; i < count; i++){
        particles.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: (Math.random() * 1.2 + 0.3) * DPR,
          vx: (Math.random() - 0.5) * 0.15 * DPR,
          vy: (Math.random() - 0.5) * 0.15 * DPR,
          a: Math.random() * 0.5 + 0.2,
          hue: Math.random() < 0.5 ? '122,140,255' : (Math.random() < 0.5 ? '255,255,255' : '255,92,240')
        });
      }
    }
    initParticles();
    window.addEventListener('resize', initParticles);

    function tick(){
      ctx.clearRect(0,0,W,H);
      for (const p of particles){
        p.x += p.vx; p.y += p.vy;
        if (p.x < -10) p.x = W + 10;
        if (p.x > W + 10) p.x = -10;
        if (p.y < -10) p.y = H + 10;
        if (p.y > H + 10) p.y = -10;
        ctx.beginPath();
        ctx.fillStyle = `rgba(${p.hue}, ${p.a})`;
        ctx.shadowColor = `rgba(${p.hue}, ${p.a})`;
        ctx.shadowBlur = 8 * DPR;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(tick);
    }
    if (!reduced) requestAnimationFrame(tick);
  })();
</script>
