<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>VOGIX — Premium Streetwear</title>
<meta name="description" content="VOGIX — Premium Hoodies & Streetwear. Designed for those who move different.">
<meta name="theme-color" content="#050505">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Space Grotesk', sans-serif;
  background: #050505;
  color: #ffffff;
  overflow-x: hidden;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
a { text-decoration: none; color: inherit; }
img { max-width: 100%; height: auto; }
button { border: none; background: none; cursor: pointer; font-family: inherit; color: inherit; }

/* ===== LOADING SCREEN ===== */
#loader {
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: #050505;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.8s ease, visibility 0.8s ease;
}
#loader.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
#loader .loader-logo {
  width: 80px;
  height: 80px;
  opacity: 0;
  transform: scale(0.5);
  animation: loaderReveal 1s 0.3s ease forwards;
}
#loader .loader-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 2rem;
  font-weight: 800;
  letter-spacing: 0.3em;
  margin-top: 1.5rem;
  opacity: 0;
  animation: loaderFadeUp 0.8s 0.8s ease forwards;
  background: linear-gradient(135deg, #ff1a1a, #ff6666, #ff1a1a);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
#loader .loader-bar-track {
  width: 200px;
  height: 2px;
  background: rgba(255,26,26,0.15);
  border-radius: 2px;
  margin-top: 2rem;
  overflow: hidden;
  opacity: 0;
  animation: loaderFadeUp 0.6s 1.2s ease forwards;
}
#loader .loader-bar-fill {
  width: 0%;
  height: 100%;
  background: #ff1a1a;
  border-radius: 2px;
  animation: loaderProgress 2s 1.4s ease forwards;
  box-shadow: 0 0 10px #ff1a1a;
}
#loader .loader-flash {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(255,26,26,0.08) 0%, transparent 70%);
  animation: loaderPulse 2s ease infinite;
}

@keyframes loaderReveal {
  to { opacity: 1; transform: scale(1); }
}
@keyframes loaderFadeUp {
  to { opacity: 1; transform: translateY(0); }
}
@keyframes loaderProgress {
  to { width: 100%; }
}
@keyframes loaderPulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.8; }
}

/* ===== CANVAS BACKGROUND ===== */
#lightning-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* ===== FOG OVERLAY ===== */
.fog-overlay {
  position: fixed;
  inset: 0;
  z-index: 1;
  background: radial-gradient(ellipse at 50% 0%, rgba(255,26,26,0.04) 0%, transparent 60%),
              radial-gradient(ellipse at 50% 100%, rgba(255,26,26,0.03) 0%, transparent 50%);
  pointer-events: none;
}

/* ===== MOUSE GLOW ===== */
#mouse-glow {
  position: fixed;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,26,26,0.06) 0%, transparent 70%);
  pointer-events: none;
  z-index: 2;
  transform: translate(-50%, -50%);
  will-change: transform;
  display: none;
}
@media (hover: hover) {
  #mouse-glow { display: block; }
}

/* ===== MAIN CONTENT ===== */
.main-content {
  position: relative;
  z-index: 5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
  opacity: 0;
  transition: opacity 1s ease;
}
.main-content.visible { opacity: 1; }

/* ===== HERO CONTAINER ===== */
.hero-container {
  width: 100%;
  max-width: 520px;
  background: rgba(10, 10, 10, 0.6);
  border: 1px solid rgba(255, 26, 26, 0.12);
  border-radius: 28px;
  padding: 2.5rem 1.5rem 2rem;
  position: relative;
  overflow: hidden;
}
.hero-container::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 28px;
  padding: 1px;
  background: linear-gradient(180deg, rgba(255,26,26,0.2) 0%, rgba(255,26,26,0.03) 50%, rgba(255,26,26,0.15) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}
.hero-container .inner-glow {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 60%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,26,26,0.5), transparent);
  pointer-events: none;
}

/* ===== HERO CONTENT ===== */
.hero-logo {
  display: block;
  width: 72px;
  height: 72px;
  margin: 0 auto 1.5rem;
  border-radius: 18px;
  opacity: 0;
  animation: heroFadeIn 0.8s 3.8s ease forwards;
  object-fit: contain;
}
.hero-title {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(2.2rem, 8vw, 3.5rem);
  font-weight: 900;
  text-align: center;
  letter-spacing: 0.15em;
  line-height: 1.1;
  margin-bottom: 0.75rem;
  opacity: 0;
  animation: heroFadeIn 0.8s 4s ease forwards;
  text-shadow: 0 0 40px rgba(255,26,26,0.4), 0 0 80px rgba(255,26,26,0.15);
}
.hero-title .v-red {
  background: linear-gradient(135deg, #ff1a1a, #ff4d4d);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 20px rgba(255,26,26,0.5));
}
.hero-subtitle {
  font-family: 'Rajdhani', sans-serif;
  font-size: clamp(0.7rem, 2.5vw, 0.85rem);
  font-weight: 600;
  text-align: center;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
  margin-bottom: 0.5rem;
  opacity: 0;
  animation: heroFadeIn 0.7s 4.2s ease forwards;
}
.hero-tagline {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(0.8rem, 2.5vw, 0.9rem);
  text-align: center;
  color: rgba(255,255,255,0.35);
  font-weight: 300;
  font-style: italic;
  margin-bottom: 2rem;
  opacity: 0;
  animation: heroFadeIn 0.7s 4.4s ease forwards;
}

@keyframes heroFadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== SOCIAL CARDS ===== */
.social-grid {
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
}
.social-card {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 0.85rem 1rem;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,26,26,0.08);
  border-radius: 16px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.3s ease, border-color 0.3s ease, background 0.3s ease;
  opacity: 0;
  animation: cardSlideIn 0.5s ease forwards;
  -webkit-tap-highlight-color: transparent;
}
.social-card:nth-child(1) { animation-delay: 4.5s; }
.social-card:nth-child(2) { animation-delay: 4.6s; }
.social-card:nth-child(3) { animation-delay: 4.7s; }
.social-card:nth-child(4) { animation-delay: 4.8s; }
.social-card:nth-child(5) { animation-delay: 4.9s; }

@keyframes cardSlideIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.social-card:hover {
  border-color: rgba(255,26,26,0.25);
  background: rgba(255,26,26,0.04);
  transform: translateY(-2px);
}
.social-card:active {
  transform: scale(0.98);
}
.social-card .ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,26,26,0.15);
  transform: scale(0);
  animation: rippleEffect 0.6s ease forwards;
  pointer-events: none;
}
@keyframes rippleEffect {
  to { transform: scale(4); opacity: 0; }
}

.social-icon-wrap {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 1.15rem;
  transition: box-shadow 0.3s ease;
}
.social-card:hover .social-icon-wrap {
  box-shadow: 0 0 15px rgba(255,26,26,0.2);
}
.social-icon-wrap.fb { background: rgba(66,103,178,0.15); color: #4267B2; }
.social-icon-wrap.ig { background: rgba(225,48,108,0.15); color: #E1306C; }
.social-icon-wrap.tt { background: rgba(255,255,255,0.08); color: #ffffff; }
.social-icon-wrap.wa { background: rgba(37,211,102,0.15); color: #25D366; }
.social-icon-wrap.st { background: rgba(255,26,26,0.12); color: #ff1a1a; }

.social-text { flex: 1; }
.social-text .social-name {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 0.95rem;
  letter-spacing: 0.04em;
  line-height: 1.2;
}
.social-text .social-handle {
  font-size: 0.72rem;
  color: rgba(255,255,255,0.35);
  letter-spacing: 0.02em;
}
.social-arrow {
  color: rgba(255,255,255,0.25);
  font-size: 0.85rem;
  transition: transform 0.3s ease, color 0.3s ease;
}
.social-card:hover .social-arrow {
  transform: translateX(3px);
  color: #ff1a1a;
}

/* ===== STATS ===== */
.stats-section {
  display: flex;
  justify-content: center;
  gap: 2rem;
  margin-top: 2rem;
  padding-top: 1.5rem;
  border-top: 1px solid rgba(255,26,26,0.08);
  opacity: 0;
  animation: heroFadeIn 0.7s 5.2s ease forwards;
}
.stat-item { text-align: center; }
.stat-value {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(1.1rem, 3vw, 1.4rem);
  font-weight: 700;
  color: #ff1a1a;
  text-shadow: 0 0 20px rgba(255,26,26,0.3);
}
.stat-label {
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.7rem;
  color: rgba(255,255,255,0.35);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-top: 0.2rem;
}

/* ===== FOOTER ===== */
.footer-text {
  text-align: center;
  margin-top: 2rem;
  font-size: 0.65rem;
  color: rgba(255,255,255,0.2);
  letter-spacing: 0.1em;
  opacity: 0;
  animation: heroFadeIn 0.5s 5.5s ease forwards;
}

/* ===== AMBIENT PARTICLES (CSS-only lightweight) ===== */
.ambient-particle {
  position: fixed;
  width: 2px;
  height: 2px;
  background: rgba(255,26,26,0.3);
  border-radius: 50%;
  pointer-events: none;
  z-index: 3;
  animation: floatParticle linear infinite;
}
@keyframes floatParticle {
  0% { transform: translateY(100vh) translateX(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-10vh) translateX(30px); opacity: 0; }
}

/* ===== RESPONSIVE ===== */
@media (min-width: 768px) {
  .hero-container {
    padding: 3rem 2.5rem 2.5rem;
  }
  .social-grid {
    gap: 0.75rem;
  }
  .social-card {
    padding: 1rem 1.2rem;
  }
  #mouse-glow {
    width: 400px;
    height: 400px;
  }
}

@media (max-width: 380px) {
  .hero-container {
    padding: 2rem 1rem 1.5rem;
    border-radius: 22px;
  }
  .stats-section {
    gap: 1.2rem;
  }
}

/* ===== REDUCED MOTION ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<script>
// ===== PERFORMANCE UTILS =====
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2);
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ===== LIGHTNING CANVAS ENGINE =====
(function() {
  const canvas = document.getElementById('lightning-canvas');
  const ctx = canvas.getContext('2d');
  let W, H;
  let bolts = [];
  let flashAlpha = 0;
  let lastTime = 0;
  let frameCount = 0;
  const maxBolts = isMobile ? 3 : 6;
  const spawnInterval = isMobile ? 220 : 120; // ms between potential spawns
  let timeSinceSpawn = 0;

  function resize() {
    W = canvas.width = window.innerWidth * dpr;
    H = canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  window.addEventListener('resize', resize);
  resize();

  // Lightning bolt class
  class LightningBolt {
    constructor(x, y, angle, depth) {
      this.segments = [];
      this.alpha = 1;
      this.life = 0;
      this.maxLife = 0.6 + Math.random() * 0.5; // seconds
      this.thickness = depth === 0 ? (isMobile ? 1.5 : 2.2) : (isMobile ? 0.6 : 1);
      this.branches = [];
      this.glowSize = depth === 0 ? (isMobile ? 8 : 15) : (isMobile ? 3 : 6);
      this.generate(x, y, angle, depth);
    }

    generate(startX, startY, angle, depth) {
      let x = startX;
      let y = startY;
      const segCount = depth === 0 ? (30 + Math.random() * 40) : (10 + Math.random() * 15);
      const segLen = depth === 0 ? (isMobile ? 10 : 14) : (isMobile ? 6 : 8);

      this.segments.push({ x, y });

      for (let i = 0; i < segCount; i++) {
        const jitter = (Math.random() - 0.5) * 0.8;
        angle += jitter;
        x += Math.cos(angle) * segLen * (0.7 + Math.random() * 0.6);
        y += Math.sin(angle) * segLen * (0.7 + Math.random() * 0.6);
        this.segments.push({ x, y });

        // Branch
        if (depth < 2 && Math.random() < (depth === 0 ? 0.12 : 0.06)) {
          const branchAngle = angle + (Math.random() - 0.5) * 1.2;
          this.branches.push(new LightningBolt(x, y, branchAngle, depth + 1));
        }
      }
    }

    update(dt) {
      this.life += dt;
      const progress = this.life / this.maxLife;
      this.alpha = progress < 0.1 ? progress / 0.1 : Math.max(0, 1 - (progress - 0.1) / 0.9);
      this.branches.forEach(b => b.update(dt));
      return this.life < this.maxLife;
    }

    draw(ctx) {
      if (this.alpha <= 0 || this.segments.length < 2) return;

      // Glow layer
      ctx.save();
      ctx.globalAlpha = this.alpha * 0.3;
      ctx.strokeStyle = '#ff1a1a';
      ctx.lineWidth = this.glowSize;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(this.segments[0].x, this.segments[0].y);
      for (let i = 1; i < this.segments.length; i++) {
        ctx.lineTo(this.segments[i].x, this.segments[i].y);
      }
      ctx.stroke();
      ctx.restore();

      // Core bolt
      ctx.save();
      ctx.globalAlpha = this.alpha * 0.9;
      ctx.strokeStyle = '#ff4444';
      ctx.lineWidth = this.thickness;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(this.segments[0].x, this.segments[0].y);
      for (let i = 1; i < this.segments.length; i++) {
        ctx.lineTo(this.segments[i].x, this.segments[i].y);
      }
      ctx.stroke();
      ctx.restore();

      // White hot core
      ctx.save();
      ctx.globalAlpha = this.alpha * 0.6;
      ctx.strokeStyle = '#ffaaaa';
      ctx.lineWidth = this.thickness * 0.4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(this.segments[0].x, this.segments[0].y);
      for (let i = 1; i < this.segments.length; i++) {
        ctx.lineTo(this.segments[i].x, this.segments[i].y);
      }
      ctx.stroke();
      ctx.restore();

      // Draw branches
      this.branches.forEach(b => b.draw(ctx));
    }
  }

  function spawnBolt() {
    if (bolts.length >= maxBolts) return;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const type = Math.random();

    let x, y, angle;
    if (type < 0.5) {
      // Top-down strikes
      x = Math.random() * vw;
      y = -10;
      angle = Math.PI / 2 + (Math.random() - 0.5) * 0.6;
    } else if (type < 0.75) {
      // Side strikes (left)
      x = -10;
      y = Math.random() * vh * 0.5;
      angle = (Math.random() - 0.3) * 0.8;
    } else {
      // Side strikes (right)
      x = vw + 10;
      y = Math.random() * vh * 0.5;
      angle = Math.PI + (Math.random() - 0.5) * 0.8;
    }

    bolts.push(new LightningBolt(x, y, angle, 0));
    flashAlpha = 0.06 + Math.random() * 0.06;
  }

  function animate(timestamp) {
    if (prefersReducedMotion) return;

    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    // Flash overlay
    if (flashAlpha > 0.001) {
      ctx.save();
      ctx.globalAlpha = flashAlpha;
      ctx.fillStyle = '#1a0000';
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
      ctx.restore();
      flashAlpha *= 0.92;
    }

    // Update & draw bolts
    bolts = bolts.filter(b => b.update(dt));
    bolts.forEach(b => b.draw(ctx));

    // Spawn logic
    timeSinceSpawn += dt * 1000;
    if (timeSinceSpawn > spawnInterval) {
      timeSinceSpawn = 0;
      if (Math.random() < 0.35) {
        spawnBolt();
        // Occasionally double-strike
        if (Math.random() < 0.2) {
          setTimeout(spawnBolt, 50 + Math.random() * 100);
        }
      }
    }

    requestAnimationFrame(animate);
  }

  requestAnimationFrame((ts) => {
    lastTime = ts;
    animate(ts);
  });
})();

// ===== MOUSE GLOW =====
(function() {
  const glow = document.getElementById('mouse-glow');
  if (!glow || isMobile) return;

  let mx = -500, my = -500;
  let cx = -500, cy = -500;

  document.addEventListener('mousemove', (e) => {
    mx = e.clientX;
    my = e.clientY;
  }, { passive: true });

  function updateGlow() {
    cx += (mx - cx) * 0.1;
    cy += (my - cy) * 0.1;
    glow.style.transform = `translate(${cx - 150}px, ${cy - 150}px) translate3d(0,0,0)`;
    requestAnimationFrame(updateGlow);
  }
  requestAnimationFrame(updateGlow);
})();

// ===== RIPPLE EFFECT ON CARDS =====
document.querySelectorAll('.social-card').forEach(card => {
  card.addEventListener('click', function(e) {
    const rect = this.getBoundingClientRect();
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    this.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  });
});

// ===== COUNTER ANIMATION =====
function animateCounters() {
  document.querySelectorAll('.stat-value').forEach(el => {
    const target = parseInt(el.dataset.target);
    const suffix = el.dataset.suffix || '';
    const duration = 2000;
    const start = performance.now();

    function tick(now) {
      const elapsed = now - start;
      const progress = Math.min(elapsed / duration, 1);
      // Ease out cubic
      const ease = 1 - Math.pow(1 - progress, 3);
      const current = Math.round(ease * target);

      if (target >= 1000) {
        el.textContent = (current / 1000).toFixed(current >= target ? 0 : 1).replace(/\.0$/, '') + 'K' + suffix;
      } else {
        el.textContent = current + suffix;
      }

      if (progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

// ===== LOADING SEQUENCE =====
window.addEventListener('load', () => {
  setTimeout(() => {
    const loader = document.getElementById('loader');
    loader.classList.add('hidden');

    const main = document.getElementById('main-content');
    main.classList.add('visible');

    // Start counters after content appears
    setTimeout(animateCounters, 2200);
  }, 3500);
});

// Fallback: if load takes too long, force show
setTimeout(() => {
  const loader = document.getElementById('loader');
  if (!loader.classList.contains('hidden')) {
    loader.classList.add('hidden');
    document.getElementById('main-content').classList.add('visible');
    animateCounters();
  }
}, 8000);
</script>

</body>
</html>
